name: "💎 Sesli Lüks Hayatlar (@Sesliluksbot) — 2K Reels, guzelai.com & @guzelaicom Pinterest Otomasyonu"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Lüks Yaşam Kategorisi (otomatik / taki / makyaj / kombin / otel / araba)"
        required: false
        default: "otomatik"
        type: choice
        options:
          - otomatik
          - taki
          - makyaj
          - kombin
          - otel
          - araba
      force_run:
        description: "Hemen yeni 2K Reels üret (1 = Evet, 0 = Sadece Kuyruk Varsa)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: luxurylifeai-reels-pipeline
  cancel-in-progress: false

jobs:
  produce-and-deliver-luxury-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Depoyu İndir (Checkout)"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: "🐍 Python 3.11 Kurulumu"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "🎬 FFmpeg ve 2K Sinema Font Kütüphanelerini Kur"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: "📦 Python Bağımlılıklarını Yükle"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "💎 2K GraphMotion Plus Reels Üretimi & Telegram Teslimatı"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          LUXURY_CATEGORY: ${{ github.event.inputs.category || 'otomatik' }}
          FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python src/main.py --category "$LUXURY_CATEGORY" --output output/luxury_reel_final.mp4
