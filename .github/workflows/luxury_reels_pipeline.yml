name: "💎 GüzelAI.com (@Sesliluksbot) — TR • EU • US Takı & Kozmetik GraphMotion 3.0 (9:16 Dikey) Otomasyonu"

on:
  schedule:
    # Her sabah saat 09:00 TSİ (06:00 UTC) — Argon'suz GitHub Actions Bulut Otomasyonu
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Yeni 9:16 Dikey TR/EU/US Takı & Kozmetik GraphMotion 3.0 Reklamı Üret ve Yayınla (1 = Evet)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: guzelai-treuus-jewelry-cosmetics-graphmotion3
  cancel-in-progress: false

jobs:
  produce-and-deliver-graphmotion3-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "📥 Depoyu İndir (Checkout)"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: "🐍 Python 3.11 Kurulumu"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "🎬 FFmpeg ve Sinema Font Kütüphanelerini Kur"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: "📦 Python Bağımlılıklarını Yükle"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "💎 GraphMotion 3.0 TR/EU/US Takı & Kozmetik 9:16 Dikey Reklam Üretimi & Telegram/Web/Pinterest Yayını (Argon'suz Bulut & Instagram Kapalı)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '995164733' }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ENABLE_INSTAGRAM_PUBLISHING: "0"
        run: |
          python src/daily_0900_omnichannel_publisher.py --force-publish --skip-ig-upload

      - name: "💾 Sıfır-Tekrar Defteri ve Günlük Kanal Aktivite Raporunu GitHub Deposuna Kaydet"
        if: ${{ always() }}
        run: |
          git config user.name "GuzelAI GraphMotion 3.0 Bot"
          git config user.email "bot@guzelai.com"
          for f in \
            output/vertical_7models_zero_repeat_ledger.json \
            output/daily_omnichannel_published_ledger.json \
            output/reports/agent_self_activity_ledger.json \
            output/reports/daily_channel_activity_report_latest.md \
            output/reports/daily_channel_activity_report_latest.json; do
            if [ -e "$f" ]; then
              git add -f "$f" || true
            fi
          done
          git diff --staged --quiet || (git commit -m "chore(graphmotion3): persist 7-model zero-repeat ledger & daily channel report [skip ci]" && (git pull --rebase origin main || true) && git push)
