name: "💎 GüzelAI.com (@Sesliluksbot) — TR • EU • US Takı & Kozmetik GraphMotion 3.0 (9:16 Dikey) Otomasyonu"

on:
  schedule:
    # Her sabah saat 09:00 TSİ (06:00 UTC) — Günde 1 Özgün 9:16 Dikey Takı & Kozmetik Reklam Paketi
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Yeni 9:16 Dikey TR/EU/US Takı & Kozmetik GraphMotion 3.0 Reklamı Üret ve Yayınla (1 = Evet)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: guzelai-treuus-jewelry-cosmetics-graphmotion3
  cancel-in-progress: false

jobs:
  produce-and-deliver-graphmotion3-ad:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: "📥 Depoyu İndir (Checkout)"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: "🐍 Python 3.11 Kurulumu"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "🎬 FFmpeg ve Sinema Font Kütüphanelerini Kur"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: "📦 Python Bağımlılıklarını Yükle"
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "💎 GraphMotion 3.0 TR/EU/US Takı & Kozmetik 9:16 Dikey Reklam Üretimi & Telegram/Web/Pinterest Yayını (Instagram Kilitli/Kapalı)"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '995164733' }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          ENABLE_INSTAGRAM_PUBLISHING: "0"
        run: |
          python src/daily_0900_omnichannel_publisher.py --force-publish --skip-ig-upload
